server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s;
    set $api_backend http://api:8000;
    client_max_body_size 32k;
    location = /webhooks/twilio/whatsapp {
        limit_except POST { deny all; }
        proxy_pass $api_backend;
        proxy_read_timeout 12s;
    }
    location / { return 404; }
}
